[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The Timbre Authors"]
publish = false

[workspace.dependencies]
# Internal crates. Version and path are declared once, here.
timbre-shared-types = { path = "crates/shared-types" }
timbre-api-contracts = { path = "crates/api-contracts" }
timbre-server = { path = "crates/server" }
timbre-library = { path = "crates/library" }
timbre-audio-engine = { path = "crates/audio-engine" }
timbre-devices = { path = "crates/devices" }
timbre-discovery = { path = "crates/discovery" }
timbre-remote-access = { path = "crates/remote-access" }
timbre-integrations = { path = "crates/integrations" }
timbre-ui = { path = "crates/ui" }

# Third-party dependencies. A version is agreed once, here, and referenced
# with `dep = { workspace = true }` rather than repeated per crate.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
